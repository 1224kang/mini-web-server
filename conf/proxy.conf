# mini-web-server 설정 (make run-proxy)
#   ./webserver -c conf/proxy.conf 18080 www

cgi_dir        cgi-bin
cgi_timeout_ms 5000

keepalive_timeout_ms  5000
header_timeout_ms    10000
body_timeout_ms      30000

# /api/ 로 시작하는 요청은 백엔드 3개에게 번갈아 넘긴다 (Round-Robin)
proxy /api/ 127.0.0.1:8001 127.0.0.1:8002 127.0.0.1:8003

# 백엔드가 이 시간 안에 연결을 받아 주지 않으면 다음 백엔드로 (모두 실패하면 504)
proxy_connect_timeout_ms 1000
# 백엔드가 이 시간 동안 한 바이트도 안 보내면 그 백엔드를 down 으로 표시하고, GET/HEAD 는 다른 백엔드로 재시도(아니면 504)
proxy_timeout_ms 3000
# 연결 실패나 응답 시간 초과가 난 백엔드는 이 시간 동안 건너뛴다
proxy_fail_timeout_ms 10000
# 응답 시간 초과 뒤 GET/HEAD 를 다른 백엔드로 재시도할 수 있는 한도(첫 시도부터)
proxy_retry_timeout_ms 5000
