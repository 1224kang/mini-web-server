<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>POST 폼</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main>
    <h1>POST 폼 → CGI</h1>
    <p>보내기를 누르면 브라우저가 <code>name=...&amp;message=...</code> 를 요청 본문에 담아 보냅니다.
       서버는 그 본문을 <code>/cgi-bin/form</code> 프로세스의 stdin 으로 흘려 넣습니다.</p>
    <form method="post" action="/cgi-bin/form">
      <p><label>이름 <input name="name" value="정글"></label></p>
      <p><label>메시지 <input name="message" value="안녕 & 반가워"></label></p>
      <p><button type="submit">보내기</button></p>
    </form>
    <p><a href="/">처음으로</a></p>
  </main>
</body>
</html>
