# mini-web-server 설정 파일
#   실행: ./mini_web_server -c config.conf
#   우선순위: 기본값 < 이 파일 < 명령줄 옵션(-p, -r, -t, -q, -R)
#   상대 경로(root)는 서버를 실행한 디렉토리 기준입니다.

port                    8080
root                    ./www

# Phase 3: 동시성
threads                 8          # 워커 스레드 수
queue_size              256        # 대기 연결 큐 (가득 차면 503)
keepalive_timeout       5          # keep-alive 유휴 대기 (초)
request_timeout         10         # 소켓 읽기/쓰기 타임아웃 SO_RCVTIMEO/SO_SNDTIMEO (초)
max_keepalive_requests  100        # 연결 하나당 최대 요청 수

# Phase 4: 리버스 프록시
proxy_connect_timeout   3          # 백엔드 connect 타임아웃 (초) -> 초과 시 504
proxy_timeout           10         # 백엔드 응답 대기 타임아웃 (초) -> 초과 시 504

# route <prefix> <backend> [backend ...]   (Round-Robin, 가장 긴 prefix 우선)
route  /api/  127.0.0.1:8001  127.0.0.1:8002
